name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v6

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar os arquivos públicos
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css font-data.js _site/
          cp placa.obj placa.mtl padrao.png padrao-azul.png padrao-vermelho.png preto.png azul.png vermelho.png placa.png _site/
          cp placa_antigo.obj placa_antigo.mtl placa_antigo.png _site/
          touch _site/.nojekyll

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
